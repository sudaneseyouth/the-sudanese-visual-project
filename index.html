<script>
        const GITHUB_USERNAME = "sudaneseyouth"; 
        const GITHUB_REPO = "the-sudanese-visual-project"; 
        const ADMIN_PASS = "Sudan2026!"; 

        function openAdminModal() {
            const overlay = document.getElementById('adminModalOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
                document.getElementById('adminPassInput').value = '';
                document.getElementById('githubTokenInput').value = '';
                document.getElementById('adminModalError').style.display = 'none';
                document.getElementById('adminPassInput').focus();
            }
        }

        function closeAdminModal() {
            const overlay = document.getElementById('adminModalOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        function unlockAdmin() {
            const enteredPass = document.getElementById('adminPassInput').value;
            const token = document.getElementById('githubTokenInput').value.trim();

            if (enteredPass === ADMIN_PASS && token.length > 5) {
                window.userGithubToken = token;
                closeAdminModal();
                const dash = document.getElementById('adminDashboard');
                if (dash) {
                    dash.style.display = 'block';
                    dash.scrollIntoView({ behavior: 'smooth' });
                }
            } else {
                const err = document.getElementById('adminModalError');
                if (err) {
                    err.innerText = "Invalid passcode or token!";
                    err.style.display = 'block';
                }
            }
        }

        // Safe Unicode Base64 Helper Functions
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        function b64_to_utf8(str) {
            return decodeURIComponent(escape(window.atob(str)));
        }

        async function loadGallery() {
            const gallery = document.getElementById('gallery');
            if (!gallery) return;

            try {
                const res = await fetch('gallery.json?v=' + Date.now());
                if (res.ok) {
                    const items = await res.json();
                    if (items && items.length > 0) {
                        gallery.innerHTML = items.map(item => `
                            <div class="gallery-item" data-category="${item.category}" data-title="${item.title}" onclick="openLightbox('${item.src}')">
                                <img src="${item.src}" alt="${item.title}">
                                <div class="item-info">
                                    <span>${item.title}</span>
                                    <span class="item-tag">${item.categoryText}</span>
                                </div>
                            </div>
                        `).join('');
                        return;
                    }
                }
            } catch (e) {
                console.error("Gallery loading error:", e);
            }
        }

        async function handleImageUpload(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('publishBtn');
            submitBtn.innerText = "Publishing to GitHub...";
            submitBtn.disabled = true;

            const fileInput = document.getElementById('photoFileInput').files[0];
            const titleInput = document.getElementById('photoTitleInput').value.trim();
            const categorySelect = document.getElementById('photoCategorySelect');
            const categoryVal = categorySelect.value;
            const categoryText = categorySelect.options[categorySelect.selectedIndex].text;

            if (!fileInput) {
                alert("Please choose a file first.");
                submitBtn.innerText = "Publish Photo to GitHub";
                submitBtn.disabled = false;
                return;
            }

            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(fileInput);
                });

                const ext = fileInput.name.split('.').pop().toLowerCase();
                const fileName = `uploads/img_${Date.now()}.${ext}`;

                // 1. Upload Image File to GitHub
                const uploadRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${window.userGithubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Admin upload image: ${titleInput}`,
                        content: base64Data
                    })
                });

                if (!uploadRes.ok) {
                    const errJson = await uploadRes.json();
                    throw new Error(errJson.message || "Image upload failed.");
                }

                // 2. Fetch or Create gallery.json
                let currentJson = [];
                let sha = null;
                const jsonRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/gallery.json`, {
                    headers: { 'Authorization': `Bearer ${window.userGithubToken}` }
                });

                if (jsonRes.ok) {
                    const jsonFileData = await jsonRes.json();
                    sha = jsonFileData.sha;
                    const cleanContent = jsonFileData.content.replace(/\s/g, '');
                    currentJson = JSON.parse(b64_to_utf8(cleanContent));
                }

                currentJson.unshift({
                    src: fileName,
                    title: titleInput,
                    category: categoryVal,
                    categoryText: categoryText
                });

                const updatedJsonBase64 = utf8_to_b64(JSON.stringify(currentJson, null, 2));

                const updatePayload = {
                    message: `Add ${titleInput} to gallery.json`,
                    content: updatedJsonBase64
                };
                if (sha) updatePayload.sha = sha;

                const updateJsonRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/gallery.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${window.userGithubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatePayload)
                });

                if (!updateJsonRes.ok) throw new Error("Failed to update gallery.json data.");

                alert("Success! Photo published.");
                location.reload();

            } catch (err) {
                alert("Upload Error: " + err.message);
                console.error(err);
            } finally {
                submitBtn.innerText = "Publish Photo to GitHub";
                submitBtn.disabled = false;
            }
        }

        function filterCategory(category) {
            const chips = document.querySelectorAll('.filter-chip');
            chips.forEach(chip => chip.classList.remove('active'));
            if (window.event && window.event.target) {
                window.event.target.classList.add('active');
            }

            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        const searchBox = document.getElementById('searchInput');
        if (searchBox) {
            searchBox.addEventListener('keyup', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const items = document.querySelectorAll('.gallery-item');

                items.forEach(item => {
                    const title = item.getAttribute('data-title').toLowerCase();
                    if (title.includes(searchTerm)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            if (lightbox && lightboxImg) {
                lightboxImg.src = src;
                lightbox.style.display = 'flex';
            }
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            if (lightbox) lightbox.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
